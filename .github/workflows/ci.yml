name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # The plugin's own suite. The wire-vocabulary contract checks read the engine's docs, so
  # the engine is checked out beside this repository and named with AFZ_DOCS. There is no
  # install step: the plugin is POSIX sh, coreutils, awk, and one vendored bash parser.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: DustinEwan/autofuzz
          path: .engine

      - name: Tests
        run: AFZ_DOCS=$GITHUB_WORKSPACE/.engine/docs sh test/run-tests.sh

  # The conformance gate, run through the product command rather than a bespoke harness:
  # `afz install-harness` drives the suite and prints the report.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install afz
        run: cargo install --git https://github.com/DustinEwan/autofuzz.git afz-cli --locked

      - name: Validate
        run: afz install-harness "$GITHUB_WORKSPACE" --json > report.json

      # The mechanism's own conformance check: prpc-core spawns `sh plugin/server.sh` and
      # runs the six wire rules (spawn, protocol-version, handshake-schema, unknown-method,
      # framing-intact, process-alive), then runs the profile's suite program - `afz
      # validate-harness` - and prints the profile's rules after the wire rules. The profile
      # spec and the schemas it names come from a shallow clone of the engine rather than a
      # copy in this repository, because a copy would drift from the engine this plugin is
      # validated against. The runner runs from this workspace because the suite program
      # resolves the manifest's relative paths, and the emitter, beside the directory it was
      # started in. It exits non-zero on any violation or suite error, so a broken wire
      # contract fails this job.
      - name: Wire conformance
        run: |
          cargo install plugin-rpc --bin prpc-core --version 0.1.0-alpha.11 --locked
          git clone --depth 1 https://github.com/DustinEwan/autofuzz.git "$RUNNER_TEMP/afz-engine"
          prpc-core "$RUNNER_TEMP/afz-engine/afz-1.profile.json" ./afz-harness.json --suite

      # The goldens this repository publishes: zero violations, nine template passes,
      # the three justified absences the manifest declares, and the two the fixture
      # validator reports for itself. A deleted or gutted validator fails the second
      # assertion.
      - name: Assert the report
        run: |
          jq -e '((.violations | length) == 0)
                 and ((.template.properties | map(select(.verdict == "not-applicable") | .id) | sort) == ["coverage-digest-live","method-receiver","unbuildable-symbol"])
                 and ((.template.properties | map(select(.verdict == "pass")) | length) == 9)' report.json
          jq -e '((.validator.properties | map(select(.verdict == "pass")) | length) == 5)
                 and ((.validator.properties | map(select(.verdict == "not-applicable") | .id) | sort) == ["coverage-digest-live","method-receiver"])' report.json
